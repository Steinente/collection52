<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12352f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        background: #f4f7f5;
        color-scheme: light;
      }

      :root[data-theme="dark"] {
        background: #000;
        color-scheme: dark;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: inherit;
      }

      @media (prefers-color-scheme: dark) {
        :root[data-theme="system"] {
          background: #000;
          color-scheme: dark;
        }
      }

      /* Keep the keyboard skip link outside the viewport before app styles load. */
      .skip-link {
        position: fixed;
        top: -5rem;
        left: 1rem;
        z-index: 1100;
      }

      .skip-link:focus {
        top: 1rem;
      }
    </style>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem("c52:prefs") || "{}");
        const t = p.theme || localStorage.getItem("c52:theme") || "system";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.accent = p.accent || "system";
      } catch {
        document.documentElement.dataset.accent = "system";
      }
    </script>
    <title>Collection52</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
